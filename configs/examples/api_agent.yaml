kind: agent
name: api_agent
description: >
  Calls external REST APIs on behalf of the user, confirms any write
  operations before executing them, and saves responses as artifacts.
spec:
  systemPrompt: >
    You are an API integration agent. You help users interact with external
    REST APIs by constructing and executing HTTP requests, inspecting responses,
    and saving results.

    Your rules:
    1. For read operations (GET, HEAD): execute immediately and return the
       response in a readable format.
    2. For write operations (POST, PUT, PATCH, DELETE): ALWAYS use the
       human-in-the-loop tool to show the user the full request details
       (URL, method, headers, body) and ask for explicit approval before
       sending. Never skip this confirmation step.
    3. Parse and explain the response clearly. If the response is JSON,
       structure it in a readable way. Note any error codes and explain
       what they mean.
    4. Use the artifact tools to save any response the user wants to keep
       or reference later.

    If the user provides an API key or token, handle it only within the
    request and never echo it back in your response.

  toolsets:
    - builtin_web_request_tools
    - hil_tools
    - builtin_artifact_tools

  skills:
    - id: call_api
      name: Call REST API
      description: >
        Construct and execute an HTTP request to an external REST API and
        return the parsed response.
      tags: [api, http, rest, integration]
      examples:
        - GET the current weather from this API endpoint.
        - Fetch the list of users from https://api.example.com/users.
      inputModes: [text]
      outputModes: [text, application/json]

    - id: api_write_with_approval
      name: API Write with Approval
      description: >
        Submit a write operation (POST, PUT, PATCH, DELETE) to an external
        API after getting explicit user confirmation.
      tags: [api, write, approval, hil]
      examples:
        - Create a new record in this API with the following data.
        - Delete the entry with ID 42 from this endpoint.
        - Update the status field via a PATCH request.
      inputModes: [text]
      outputModes: [text, application/json]

    - id: save_api_response
      name: Save API Response
      description: Save an API response as a named artifact for later use.
      tags: [api, artifact, export]
      examples:
        - Fetch this data from the API and save it as an artifact.
      inputModes: [text]
      outputModes: [text, application/json]

  skillRefs: []
  skillIds: []
  connectors: []
  inputModes: [text]
  outputModes: [text, application/json]

  additionalConfigurations:
    agentCard:
      priority: 15
      welcome:
        message: "Give me an API endpoint and I will handle the request for you."
        suggestions:
          - label: GET request
            prompt: Make a GET request to the following URL:
          - label: POST with approval
            prompt: POST the following data to this endpoint (I will confirm before sending):
          - label: Save response
            prompt: Fetch data from this API and save the response as an artifact:

  deploy: false
