kind: agent
name: document_analyst
description: >
  Converts uploaded documents into structured text and runs data analysis
  queries against the extracted content to produce actionable insights.
spec:
  systemPrompt: >
    You are a document analyst. Users will share documents with you (PDF,
    DOCX, XLSX, CSV, HTML, PPTX) and ask you to extract, analyse, and
    summarise the information inside them.

    Your workflow:
    1. Use the file tools to convert the document into Markdown so you can
       read its content.
    2. Use the data analysis tools to run SQL queries, JMESPath transforms,
       or structured merges against the extracted data when the user asks
       analytical questions (e.g. "which rows have the highest value?",
       "summarise this table").
    3. Produce a clear, structured answer. Use tables and bullet points where
       they aid clarity.
    4. Use the artifact tools to save the output if the user wants to keep
       or share the results.

    Be precise. If a document contains ambiguous data, note the ambiguity
    rather than making assumptions. Never fabricate data that is not present
    in the source document.

  toolsets:
    - builtin_file_tools
    - data_analysis
    - builtin_artifact_tools

  skills:
    - id: convert_document
      name: Convert Document
      description: >
        Convert an uploaded PDF, DOCX, XLSX, CSV, HTML, or PPTX file into
        readable Markdown text.
      tags: [documents, conversion, pdf, xlsx]
      examples:
        - Convert this PDF to text so I can read it.
        - Extract the content from this Word document.
      inputModes: [text]
      outputModes: [text]

    - id: analyse_document_data
      name: Analyse Document Data
      description: >
        Run SQL queries or structured analysis against data extracted from
        a document and return insights.
      tags: [analysis, sql, data, documents]
      examples:
        - Which rows in this spreadsheet have a value greater than 1000?
        - Summarise the sales figures from this CSV file.
        - Join these two tables from the uploaded Excel file.
      inputModes: [text]
      outputModes: [text, application/json]

    - id: export_analysis
      name: Export Analysis Report
      description: >
        Save the results of a document analysis as a named artifact.
      tags: [export, artifact, report]
      examples:
        - Analyse this report and save the key findings as an artifact.
      inputModes: [text]
      outputModes: [text, application/json]

  skillRefs: []
  skillIds: []
  connectors: []
  inputModes: [text]
  outputModes: [text, application/json]

  additionalConfigurations:
    agentCard:
      priority: 20
      welcome:
        message: "Upload a document and I will extract and analyse it for you."
        suggestions:
          - label: Convert a PDF
            prompt: Convert this PDF into readable text.
            autoSend: false
          - label: Analyse a spreadsheet
            prompt: Analyse this spreadsheet and summarise the key data.
            autoSend: false
          - label: Query document data
            prompt: Run the following query against this document:

  deploy: false
