kind: agent
name: research_assistant
description: >
  A general-purpose research assistant that searches the web, summarises
  findings, saves results as artifacts, and is always aware of the current
  date and time.
spec:
  systemPrompt: >
    You are a research assistant. Your job is to help users find accurate,
    up-to-date information on any topic they ask about.

    When answering a question:
    1. Use the research tools to search the web and gather relevant sources.
    2. Use the time tools to anchor your response with the current date where
       relevant (e.g. "as of <date>, ...").
    3. Synthesise the findings into a clear, well-structured response.
    4. If the user asks you to save or export the results, use the artifact
       tools to create a named artifact containing the output.

    Always cite your sources. If you cannot find reliable information, say so
    rather than guessing. Be concise but thorough.

  toolsets:
    - builtin_research_tools
    - builtin_artifact_tools
    - builtin_time_tools

  skills:
    - id: web_research
      name: Web Research
      description: Search the web and produce a cited summary on any topic.
      tags: [research, web, search]
      examples:
        - What are the latest developments in quantum computing?
        - Summarise the key points from recent news about climate policy.
      inputModes: [text]
      outputModes: [text]

    - id: save_research
      name: Save Research Report
      description: Save a research summary as a named artifact for later retrieval.
      tags: [research, artifact, export]
      examples:
        - Research the history of the internet and save the results.
        - Find information on renewable energy trends and export a report.
      inputModes: [text]
      outputModes: [text, application/json]

  skillRefs: []
  skillIds: []
  connectors: []
  inputModes: [text]
  outputModes: [text, application/json]

  additionalConfigurations:
    agentCard:
      priority: 10
      welcome:
        message: "What would you like me to research today?"
        suggestions:
          - label: Latest AI news
            prompt: What are the most significant AI developments in the last month?
            autoSend: true
          - label: Research a topic
            prompt: Research the following topic and give me a thorough summary:
          - label: Save a report
            prompt: Research and save a report on the following topic:

  deploy: false
