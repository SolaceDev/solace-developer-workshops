# configs/gwe/auth/oidc_providers.yaml
# OIDC provider catalog for the enterprise gateway.
# Top-level key matches Python oauth2_config.yaml; see Go spec at
# docs/superpowers/specs/2026-04-23-multi-provider-oidc-design.md.
providers:
  azure:
    issuer: "${OIDC_ISSUER}"
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
    scopes: ["openid", "email", "profile", "offline_access"]
    # For self-signed or private-CA IdPs, pin a CA bundle:
    ca_cert_path: "${OIDC_CA_CERT_PATH, }"
    # DEV ONLY — disables TLS validation, exposes tokens to MITM:
    insecure_skip_verify: ${OIDC_INSECURE_SKIP_VERIFY, false}
    # DEV ONLY — drops the Secure flag on the OIDC state cookie so login
    # works over http://localhost. Leave unset in production.
    # dev_mode: true
