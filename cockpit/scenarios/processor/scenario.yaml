id: processor
order: 50
eyebrow: Patterns
title: Processor
summary: >
  A processor consumes an event, changes it, and publishes the result on a
  different topic. Here an enricher adds the model and shift, then a router
  decides a region and puts it in the topic so downstream can subscribe to
  the region it cares about. Both ends go through the broker, so a stage can
  be added to a running pipeline without touching the stages either side.

objectives:
  - Follow one event through two stages and see what each adds
  - Understand why a processor acknowledges its input only after its output is accepted
  - Start a stage into a live pipeline and watch it drain the backlog its queue collected
  - Turn a routing decision into a topic level, so downstream filters by subscription rather than by code

# The router is left out on purpose. Start it by hand once vehicles are
# flowing: its queue has been filling since Apply, so it drains a backlog and
# joins the pipeline without the enricher or the sink changing.
run:
  - apply
  - build
  - sink
  - enrich
  - line

diagram:
  caption: >
    Each stage reads from its own queue on the broker and publishes its result
    back to the broker, on a topic the next stage's queue subscribes to.
    Nothing points at the next stage directly, which is why one can be
    replaced or added while the others keep running.
  duration: 3.2
  liveWhen: line
  nodes:
    - id: line
      label: Assembly Line
      sublabel: assembly/started
      kind: app
      col: 0
      action: line
      requires:
        - label: svc-processor-line
          semp: /msgVpns/{vpn}/clientUsernames/svc-processor-line
    # Every stage reads from the broker and publishes back to it. Each queue is
    # a box inside the broker because that is where it lives.
    - id: broker
      label: Solace Broker
      sublabel: one queue per stage
      kind: broker
      col: 1
      action: apply
      contains:
        - id: assembly
          label: q.processor.assembly
        - id: router
          label: q.processor.router
      provides:
        - label: q.processor.assembly
          group: assembly
          semp: /msgVpns/{vpn}/queues/q.processor.assembly
        - label: q.processor.router
          group: router
          semp: /msgVpns/{vpn}/queues/q.processor.router
    - id: enrich
      label: Enricher
      sublabel: adds model and shift
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: enrich
      requires:
        - label: q.processor.assembly
          semp: /msgVpns/{vpn}/queues/q.processor.assembly
    - id: route
      label: Router
      sublabel: start me late
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: route
      requires:
        - label: q.processor.router
          semp: /msgVpns/{vpn}/queues/q.processor.router
    - id: sink
      label: EMEA Fulfilment
      sublabel: routed/v1/emea/>
      kind: app
      col: 2
      action: sink
      requires:
        - label: svc-processor-sink
          semp: /msgVpns/{vpn}/clientUsernames/svc-processor-sink
  flows:
    - from: line
      to: broker
      label: started
      delay: 0
    - from: broker
      to: enrich
      delay: 0.5
    - from: enrich
      to: broker
      label: enriched
      delay: 1.0
    - from: broker
      to: route
      delay: 1.5
    - from: route
      to: broker
      label: routed/emea
      delay: 2.0
    - from: broker
      to: sink
      delay: 2.5

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates one queue per stage with its subscription, plus the client
      profile, ACL profile and four client usernames.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: line
    label: Start the assembly line
    kind: process
    cmd: [bash, ../../apps/run.sh, processor, line]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Publishes an assembly-started event every two seconds, alternating
      between the Michigan and Bremen plants.

  - id: enrich
    label: Start the enricher
    kind: process
    cmd: [bash, ../../apps/run.sh, processor, enrich]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Consumes started events, adds the model and shift, and republishes them
      as enriched. It acknowledges its input only once the broker has accepted
      its output, so a failure means redelivery rather than a lost vehicle.

  - id: route
    label: Start the router (late)
    kind: process
    cmd: [bash, ../../apps/run.sh, processor, route]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The stage to add while the pipeline runs. It maps the plant to a region
      and writes that into the topic. Its queue has been collecting enriched
      events since Apply, so it starts by draining them.

  - id: sink
    label: Start EMEA fulfilment
    kind: process
    cmd: [bash, ../../apps/run.sh, processor, sink]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Subscribes to routed events for one region only. Vehicles from the
      Michigan plant are routed to namer and never reach this pane, without
      this app filtering anything itself.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, processor]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes both stage queues and the access control for this scenario.

# Ways to break the scenario on purpose. Each names the steps that cause it
# and the steps that put things back; see pub-sub for the full shape.
failure_modes:
  - id: stage-down
    title: A queued stage goes down
    breaks: >
      With the router running, the enricher stops while the assembly line
      keeps publishing.
    watch: >
      Open Stage inboxes under On the broker: q.processor.assembly climbs as
      events wait for the enricher, and EMEA fulfilment goes quiet. Reset
      starts the enricher again and it works through the backlog, so nothing
      downstream misses an event.
    why: >
      The enricher reads from its own queue. While it is down, the line's
      events still match that queue's subscription, so the broker spools them
      there. The stages after it simply receive nothing until it returns.
    real_world: >
      One stage of a pipeline is redeployed, or its database goes away for a
      few minutes. Because each stage has its own queue, the rest of the
      pipeline keeps running and the stalled stage catches up when it comes
      back. The thing to watch is queue depth: a steadily rising inbox is how
      you spot a stage that has stopped or cannot keep up.
    docs:
      - label: "Go API: consuming persistent messages and acknowledgments"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: queues"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Queues.htm
    node: enrich
    logs: enrich
    trigger:
      # Play leaves the router out on purpose. Both failures need the
      # whole pipeline running, so make sure it is up first.
      - start: route
      - stop: enrich
    reset:
      - start: enrich

  - id: sink-down
    title: The direct subscriber at the end goes down
    breaks: >
      With the router running, EMEA fulfilment stops. It is the one stage
      that subscribes directly instead of reading from a queue.
    watch: >
      The stages before it keep working and publishing routed events, which
      now reach nobody. Reset after a few events: fulfilment picks up from the
      next one, and the ones routed while it was down are gone. Compare that
      with the enricher, which caught up.
    why: >
      A direct subscription only exists while the subscriber is connected, so
      while fulfilment is down its routed events match no one and are
      discarded. Nothing upstream can tell, because publishing to a topic does
      not depend on anyone listening.
    real_world: >
      The last hop in a pipeline is often the one someone wires up quickly
      with a direct subscription, and it is exactly where losing events is
      most expensive: an order that was enriched and routed but never
      fulfilled. A queue at every stage that must not lose work is the usual
      fix.
    docs:
      - label: "Go API: consuming direct messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-DM-Subscribe.htm
      - label: "Broker: direct messages"
        url: https://docs.solace.com/Messaging/Direct-Msg/Direct-Messages.htm
    node: sink
    logs: sink
    trigger:
      # Play leaves the router out on purpose. Both failures need the
      # whole pipeline running, so make sure it is up first.
      - start: route
      - stop: sink
    reset:
      - start: sink

inspect:
  - label: Stage inboxes
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=100
    # msgSpoolUsage is the live backlog. Before the router starts, its queue
    # is the only one with a non-zero figure.
    columns: [queueName, accessType, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
  - label: Router inbox consumers
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues/q.processor.router/txFlows?count=10
    columns: [clientName, ackedMsgCount, unackedMsgCount, redeliveredMsgCount]
    ui_hint: Manager → Queues → q.processor.router → Consumers
  - label: Queue Subscriptions
    kind: semp
    path: /msgVpns/{vpn}/queues/q.processor.router/subscriptions
    columns: [queueName, subscriptionTopic]
    ui_hint: Manager → Queues → q.processor.router → Subscriptions
