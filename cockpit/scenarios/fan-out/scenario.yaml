id: fan-out
order: 30
eyebrow: Patterns
title: Fan-Out
summary: >
  One publisher emits grocery order events and four consumers each receive
  their own copy. The publisher names none of them. Every consumer is a direct
  subscriber with its own topic subscription, so the broker decides who gets
  each event, and a new consumer is added without the publisher changing.

objectives:
  - See one published event delivered independently to several consumers
  - Add a consumer while the publisher runs and confirm the publisher does not change
  - See that a direct subscriber only receives what is published while it is connected
  - Read a wildcard subscription and predict which events it will match

# Analytics is deliberately left out. An attendee starts it by hand once the
# others have been running, and it starts receiving straight away with nothing
# about the publisher changed: the clearest demonstration that a consumer is a
# subscription, not a release.
run:
  - apply
  - build
  - consume-finance
  - consume-warehouse
  - consume-loyalty
  - publish

diagram:
  caption: >
    One publish enters the broker and leaves once for every matching
    subscription. All four consumers subscribe directly, with no queue in
    between, so each receives only what is published while it is connected.
  duration: 2.4
  liveWhen: pub
  nodes:
    - id: pub
      label: Order Service
      sublabel: schwarz/grocery/order/...
      kind: app
      col: 0
      action: publish
      requires:
        - label: svc-fanout-publisher
          semp: /msgVpns/{vpn}/clientUsernames/svc-fanout-publisher
    - id: broker
      label: Solace Broker
      sublabel: one copy in, four out
      kind: broker
      col: 1
      action: apply
      provides:
        - label: cp-fanout
          semp: /msgVpns/{vpn}/clientProfiles/cp-fanout
        - label: acl-fanout
          semp: /msgVpns/{vpn}/aclProfiles/acl-fanout
    - id: finance
      label: Finance
      sublabel: direct, placed only
      kind: app
      col: 2
      action: consume-finance
      requires:
        - label: svc-fanout-finance
          semp: /msgVpns/{vpn}/clientUsernames/svc-fanout-finance
    - id: warehouse
      label: Warehouse
      sublabel: direct, online only
      kind: app
      col: 2
      action: consume-warehouse
      requires:
        - label: svc-fanout-warehouse
          semp: /msgVpns/{vpn}/clientUsernames/svc-fanout-warehouse
    - id: loyalty
      label: Loyalty
      sublabel: direct, every action
      kind: app
      col: 2
      action: consume-loyalty
      requires:
        - label: svc-fanout-loyalty
          semp: /msgVpns/{vpn}/clientUsernames/svc-fanout-loyalty
    - id: analytics
      label: Analytics
      sublabel: direct, started late
      kind: app
      col: 2
      action: consume-analytics
      requires:
        - label: svc-fanout-analytics
          semp: /msgVpns/{vpn}/clientUsernames/svc-fanout-analytics
  flows:
    - from: pub
      to: broker
      label: 1 order
      delay: 0
    - from: broker
      to: finance
      label: placed/>
      delay: 0.8
    - from: broker
      to: warehouse
      label: online/>
      delay: 1.0
    - from: broker
      to: loyalty
      label: "*/v1/>"
      delay: 1.2
    - from: broker
      to: analytics
      label: grocery/>
      delay: 1.4

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the client profile, ACL profile and five client usernames. There
      are no queues: every consumer subscribes directly.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: consume-finance
    label: Start finance consumer
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, consume, --role, finance, --user, svc-fanout-finance, --sub, "schwarz/grocery/order/placed/v1/>"]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Direct subscriber to placed orders in every channel. Its subscription
      fixes the action, so cancellations never reach it.

  - id: consume-warehouse
    label: Start warehouse consumer
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, consume, --role, warehouse, --user, svc-fanout-warehouse, --sub, "schwarz/grocery/order/placed/v1/online/>"]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Direct subscriber to online orders only. One level deeper than finance,
      so it sees roughly half as many events.

  - id: consume-loyalty
    label: Start loyalty consumer
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, consume, --role, loyalty, --user, svc-fanout-loyalty, --sub, "schwarz/grocery/order/*/v1/>"]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Direct subscriber whose subscription wildcards the action, so it sees
      cancellations as well as placements.

  - id: publish
    label: Publish orders
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, publish]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Publishes one order every two seconds, alternating between the online
      and in-store channels. Every fifth order is a cancellation rather than a
      placement, so the subscriptions that wildcard the action can be told
      apart from the ones that do not.

  - id: consume-analytics
    label: Start analytics consumer (late)
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, consume, --role, analytics, --user, svc-fanout-analytics, --sub, "schwarz/grocery/>"]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The new consumer. Start it after the others have been running: it
      subscribes to everything under schwarz/grocery and starts receiving on
      the next publish. It gets nothing published before it connected, and
      nothing about the publisher changes to accommodate it.

  # Used by the subscription-typo failure mode: the same warehouse user with
  # the v1 level missing from its subscription.
  - id: consume-typo
    label: Start a consumer with a subscription typo
    kind: process
    cmd: [bash, ../../apps/run.sh, fanout, consume, --role, warehouse-typo, --user, svc-fanout-warehouse, --sub, "schwarz/grocery/order/placed/online/>"]
    cwd: .
    long_running: true
    variant: secondary
    failure_only: true
    description: >
      Subscribes to schwarz/grocery/order/placed/online/>, which is missing the
      v1 level, so it matches nothing that is published.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, fan-out]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the client usernames, ACL profile and client profile.

# Ways to break the scenario on purpose. Each names the steps that cause it
# and the steps that put things back; see pub-sub for the full shape.
failure_modes:
  - id: consumer-offline
    title: A consumer goes offline
    breaks: >
      Finance stops while the order service keeps publishing.
    watch: >
      Warehouse and loyalty carry on as if nothing happened: the publisher
      does not know or care that finance left. Reset after a few orders.
      Finance resumes with the next order, and the ones sent while it was down
      never arrive.
    why: >
      Every consumer here is a direct subscriber. Its subscription exists only
      while it is connected, so while finance is down the broker has nowhere
      to send finance's copy and that copy is simply not made. The other
      consumers are unaffected because each has its own subscription.
    real_world: >
      One team's service restarts during a deploy and misses the orders
      published in that window, while every other team gets them. Nobody else
      notices, which is the upside of fan-out, and the downside is that the
      gap is invisible to finance too. Anything that must not miss an order
      needs a queue.
    docs:
      - label: "Go API: consuming direct messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-DM-Subscribe.htm
      - label: "Broker: direct messages"
        url: https://docs.solace.com/Messaging/Direct-Msg/Direct-Messages.htm
    node: finance
    logs: consume-finance
    trigger:
      - stop: consume-finance
    reset:
      - start: consume-finance

  - id: subscription-typo
    title: A subscription with a typo
    breaks: >
      A new warehouse consumer subscribes to
      schwarz/grocery/order/placed/online/>, leaving out the v1 level.
    watch: >
      It connects and subscribes without any error, then receives nothing,
      while the real warehouse consumer keeps getting online orders. The
      broker accepted a perfectly valid subscription that just matches no
      topic anyone publishes.
    why: >
      Topic matching is level by level. The published topics have v1 as their
      fifth level, so a subscription with online in that position never
      matches, and > only stands in for the levels after it. A subscription
      is not checked against what anyone publishes, so a wrong one is not an
      error, it is silence.
    real_world: >
      A consumer ships with a topic copied from an old document, or a
      publisher adds a version level and a subscriber is not updated. Both
      show up the same way: a service that is healthy, connected and
      subscribed, with an empty inbox. Checking the subscription against a
      real published topic, level by level, is the quickest way to find it.
    docs:
      - label: "Go API: resource.TopicSubscriptionOf"
        url: https://docs.solace.com/API-Developer-Online-Ref-Documentation/go/solace.dev/go/messaging/pkg/solace/resource/index.html
      - label: "Broker: wildcard characters in topic subscriptions"
        url: https://docs.solace.com/Messaging/Wildcard-Charaters-Topic-Subs.htm
    node: warehouse
    logs: consume-typo
    trigger:
      - start: consume-typo
    reset:
      - stop: consume-typo

inspect:
  # No queues in this scenario, so the useful view is the clients: one row per
  # connected app, with how many messages the broker has sent each consumer.
  # The counts differ because the subscriptions do.
  - label: Connected Clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=100&where=clientUsername==svc-fanout*
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
  - label: Client Usernames
    kind: semp
    path: /msgVpns/{vpn}/clientUsernames?count=100&where=clientUsername==svc-fanout*
    columns: [clientUsername, enabled, clientProfileName, aclProfileName]
    ui_hint: Manager → Access Control → Client Usernames
