id: capstone-smart-shelf
order: 90
eyebrow: Capstone
title: Smart Shelf Pricing
summary: >
  Electronic shelf labels that reprice through the day, without the polling
  job that reads the whole estate every few minutes and rewrites every tag
  whether or not its price moved. Scans, stock and footfall stream in, a
  pricing engine holds a read-optimised view, and because it knows the
  current price it emits an update only when one actually changes.

objectives:
  - Combine a live stream with a read model to replace a polling job
  - See why holding current state is what makes change suppression possible
  - Read the emitted-versus-evaluated figure as the cost polling would have paid
  - Consider why the pricing engine's queue is exclusive rather than shared

run:
  - apply
  - build
  - labels
  - pricing
  - sensors

diagram:
  caption: >
    Three input streams reach the pricing engine through one queue on the
    broker. It holds the current price per shelf, so it can tell a real change
    from a reading that changes nothing, and publishes only the real ones back
    to the broker, where the shelf tags' queue picks them up.
  duration: 2.4
  liveWhen: sensors
  nodes:
    - id: sensors
      label: Store Sensors
      sublabel: scans · stock · footfall
      kind: app
      col: 0
      action: sensors
      requires:
        - label: svc-shelf-sensors
          semp: /msgVpns/{vpn}/clientUsernames/svc-shelf-sensors
    - id: broker
      label: Solace Broker
      sublabel: readings in, prices out
      kind: broker
      col: 1
      action: apply
      contains:
        - id: pricing
          label: q.shelf.pricing
        - id: labels
          label: q.shelf.labels
      provides:
        - label: q.shelf.pricing
          group: pricing
          semp: /msgVpns/{vpn}/queues/q.shelf.pricing
        - label: q.shelf.labels
          group: labels
          semp: /msgVpns/{vpn}/queues/q.shelf.labels
    # The engine consumes readings from the broker and publishes price changes
    # back to it, where the shelf tags' own queue picks them up.
    - id: pricing
      label: Pricing Engine
      sublabel: holds the price view
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: pricing
      requires:
        - label: svc-shelf-pricing
          semp: /msgVpns/{vpn}/clientUsernames/svc-shelf-pricing
    - id: labels
      label: Shelf Tags
      sublabel: changed prices only
      kind: app
      col: 2
      action: labels
      requires:
        - label: q.shelf.labels
          semp: /msgVpns/{vpn}/queues/q.shelf.labels
  flows:
    - from: sensors
      to: broker
      label: readings
      delay: 0
    - from: sensors
      to: broker
      delay: 0.2
    - from: broker
      to: pricing
      delay: 0.8
    - from: pricing
      to: broker
      label: price changes
      delay: 1.4
    - from: broker
      to: labels
      delay: 2.0

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the pricing engine's queue with its three input subscriptions,
      the label queue, and the access control for this scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: labels
    label: Start the shelf tags
    kind: process
    cmd: [bash, ../../apps/run.sh, smartshelf, labels]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Every line in this pane is one physical tag being rewritten, so the
      count here is the battery cost of the design. Compare it with the
      number of readings the sensors published.

  - id: pricing
    label: Start the pricing engine
    kind: process
    cmd: [bash, ../../apps/run.sh, smartshelf, pricing]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Keeps a price view per store and product, recomputes on every reading,
      and publishes only when the result differs from what the tag shows. It
      reports evaluated, emitted and suppressed every five seconds.

  - id: sensors
    label: Start the store sensors
    kind: process
    cmd: [bash, ../../apps/run.sh, smartshelf, sensors]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Publishes a scan, stock count or footfall reading every 300ms across
      two stores and six products. Stock drifts down through the day with the
      occasional restock, so prices move a few times rather than constantly.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, capstone-smart-shelf]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes both queues and the access control for this scenario.

# Ways to break the scenario on purpose. Each names the steps that cause it
# and the steps that put things back; see pub-sub for the full shape.
failure_modes:
  - id: pricing-down
    title: The pricing engine goes down
    breaks: >
      The pricing engine stops while the store sensors keep sending readings.
    watch: >
      Open Readings in, changes out under On the broker: q.shelf.pricing
      climbs and the shelf tags stop changing. Reset starts the engine. It
      works through the backlog, and only the readings that change a price
      reach the tags.
    why: >
      The engine reads its three input streams from one queue, so every
      reading published while it is down is spooled for it. When it comes
      back it processes them in order, rebuilds its view of the shelf and
      publishes only the prices that actually changed.
    real_world: >
      A pricing or decision service is redeployed during trading hours. With
      a queue in front of it, no stock or footfall reading is lost, and the
      shelves catch up within moments of it returning. The risk to watch is a
      backlog of stale readings driving price changes that no longer make
      sense, which is where a time to live on readings helps.
    docs:
      - label: "Go API: consuming persistent messages and acknowledgments"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: pricing
    logs: pricing
    trigger:
      - stop: pricing
    reset:
      - start: pricing

  - id: tags-offline
    title: The shelf tags go offline
    breaks: >
      The shelf tags stop while the pricing engine keeps publishing changes.
    watch: >
      The engine carries on: it publishes price changes whether the tags are
      listening or not. q.shelf.labels grows under On the broker. Reset starts
      the tags, which apply every change they missed, in order.
    why: >
      Price changes go to a topic q.shelf.labels subscribes to, so they are
      spooled while the tags are down and delivered in order when they
      reconnect. The engine never has to know whether the tags are there.
    real_world: >
      Electronic shelf labels lose their connection to the store network, or
      the label service restarts. The last price a shopper sees must be the
      current one, so missing a change is not acceptable, and a queue in
      front of the tags makes sure they converge on the right price as soon
      as they are back.
    docs:
      - label: "Go API: consuming persistent messages and acknowledgments"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: queues"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Queues.htm
    node: labels
    logs: labels
    trigger:
      - stop: labels
    reset:
      - start: labels

inspect:
  - label: Readings in, changes out
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=100
    # lastSpooledMsgId on the two queues is the comparison worth making:
    # q.shelf.pricing counts every reading, q.shelf.labels counts only the
    # price changes. The difference is what polling would have written.
    columns: [queueName, accessType, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
  - label: What feeds the pricing engine
    kind: semp
    path: /msgVpns/{vpn}/queues/q.shelf.pricing/subscriptions
    columns: [queueName, subscriptionTopic]
    ui_hint: Manager → Queues → q.shelf.pricing → Subscriptions
  - label: Connected Clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=100
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
