id: cqrs
order: 60
eyebrow: Patterns
title: Command and Query
summary: >
  Asking a fleet what it is doing by polling every device melts the network
  and gets worse as the fleet grows. Here devices publish what happened, a
  read model keeps the current picture from that stream, and a query costs
  one lookup and disturbs nothing. Commands travel the other way, addressed
  to one device and held on its queue until it reconnects.

objectives:
  - Tell a command from an event by its verb, and see why the distinction matters
  - Keep a read model current from a stream instead of polling the fleet
  - Send a command to a device that is offline and watch it arrive on reconnect
  - Understand why the read model is eventually consistent, and why that is usually fine

# The device is started last, after the twin, so the read model is already
# listening when the first telemetry arrives. Send a command while the device
# is stopped to see the queue hold it.
run:
  - apply
  - build
  - twin
  - device

diagram:
  caption: >
    Two directions, both through the broker. Commands go to a queue addressed
    to one device, so one that is offline still receives them. The device
    publishes events and telemetry back to the broker, and the read model
    subscribes to them to build the current picture.
  duration: 2.4
  liveWhen: device
  nodes:
    - id: operator
      label: Operator
      sublabel: gateway/reboot/v1/gw4471
      kind: app
      col: 0
      action: command
      requires:
        - label: svc-cqrs-operator
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-operator
    - id: broker
      label: Solace Broker
      sublabel: commands and events
      kind: broker
      col: 1
      action: apply
      contains:
        - id: commands
          label: q.cqrs.gw4471.commands
      provides:
        - label: q.cqrs.gw4471.commands
          group: commands
          semp: /msgVpns/{vpn}/queues/q.cqrs.gw4471.commands
        - label: cp-cqrs
          semp: /msgVpns/{vpn}/clientProfiles/cp-cqrs
    # The gateway consumes its commands from the broker and publishes what
    # happened back to it, so it has a flow in each direction.
    - id: device
      label: Gateway gw4471
      sublabel: obeys, then reports
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: device
      requires:
        - label: svc-cqrs-device
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-device
    - id: twin
      label: Fleet Read Model
      sublabel: connectedVehicle/*/*/v1/>
      kind: app
      col: 2
      action: twin
      requires:
        - label: svc-cqrs-twin
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-twin
  flows:
    - from: operator
      to: broker
      label: reboot
      delay: 0
    - from: broker
      to: device
      label: command
      delay: 0.6
    - from: device
      to: broker
      label: reports
      delay: 1.2
    - from: broker
      to: twin
      label: events
      delay: 1.8

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the gateway's command queue, subscribed to the imperative verbs
      only, plus the client profile, ACL profile and three usernames.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: twin
    label: Start the read model
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, twin]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Subscribes to everything the fleet publishes and keeps the current
      picture, reprinting it whenever something changes. This is the query
      side: it answers questions without reaching a single device.

  - id: device
    label: Start gateway gw4471
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, device]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Binds the command queue, reports battery every three seconds, and
      replies to each command with a past-tense event once it has acted.
      Stop this to take the gateway offline.

  - id: command
    label: Send a reboot command
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, command, --action, reboot]
    cwd: .
    variant: secondary
    description: >
      Sends one command and exits. Run it with the gateway stopped, watch the
      queue depth rise in Inspect, then start the gateway: the command is
      delivered on reconnect rather than lost or retried.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, cqrs]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the command queue and the access control for this scenario. Any
      command still waiting for the gateway goes with it.

# Ways to break the scenario on purpose. Each names the steps that cause it
# and the steps that put things back; see pub-sub for the full shape.
failure_modes:
  - id: gateway-offline
    title: The gateway goes offline
    breaks: >
      Gateway gw4471 disconnects, and then the operator sends it a reboot
      command.
    watch: >
      The command is accepted even though the gateway is gone: it waits on
      q.cqrs.gw4471.commands (see Command queue under On the broker). Reset
      reconnects the gateway, and its log shows it receiving the reboot it
      missed, then reporting that it rebooted.
    why: >
      Commands go to a queue addressed to one device, not to the device
      itself. The operator publishes to a topic the queue subscribes to, so
      the broker spools the command whether or not the device is connected,
      and delivers it when the device binds to its queue again.
    real_world: >
      Vehicles, shop-floor gateways and phones drop off the network all the
      time. Sending a command straight to a connection would fail or be lost
      whenever the device is offline. A queue per device lets the command
      centre send and move on, and the device acts on it the next time it
      connects. Set a time to live on commands that stop making sense after a
      while.
    docs:
      - label: "Go API: consuming persistent messages and acknowledgments"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: device
    logs: device
    trigger:
      - stop: device
      - start: command
    reset:
      - start: device

  - id: read-model-offline
    title: The read model goes offline
    breaks: >
      The fleet read model stops while the gateway keeps reporting battery
      levels.
    watch: >
      The gateway carries on publishing: it has no idea the read model left.
      Reset after a few reports. The read model resumes from the next report,
      and the ones sent while it was down never reach it, because it
      subscribes directly.
    why: >
      The read model uses a direct subscription, which only exists while it
      is connected. Events published while it is down match nothing and are
      discarded. That is the opposite of the command side, where the queue
      held the command for the device.
    real_world: >
      A dashboard or read model that subscribes directly will have gaps after
      every restart. That is acceptable when the next event replaces the last,
      like a battery level, and a problem when each event matters on its own,
      like a fault code. The fix is either a queue, or a read model that can
      rebuild its view by asking for current state after it reconnects.
    docs:
      - label: "Go API: consuming direct messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-DM-Subscribe.htm
      - label: "Broker: direct messages"
        url: https://docs.solace.com/Messaging/Direct-Msg/Direct-Messages.htm
    node: twin
    logs: twin
    trigger:
      - stop: twin
    reset:
      - start: twin

inspect:
  - label: Command queue
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=100
    # With the gateway stopped, msgSpoolUsage on the command queue is the
    # command waiting for it. It returns to zero once the device reconnects
    # and acknowledges.
    columns: [queueName, accessType, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
  - label: What the queue accepts
    kind: semp
    path: /msgVpns/{vpn}/queues/q.cqrs.gw4471.commands/subscriptions
    # Imperative verbs only. The past-tense events the device publishes must
    # not land back in its own inbox.
    columns: [queueName, subscriptionTopic]
    ui_hint: Manager → Queues → q.cqrs.gw4471.commands → Subscriptions
  - label: Connected Clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=100
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
