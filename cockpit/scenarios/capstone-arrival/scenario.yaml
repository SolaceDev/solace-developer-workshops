id: capstone-arrival
order: 80
eyebrow: Capstone
title: Surviving the Arrival
summary: >
  A bank of flights lands inside twenty minutes and every bag scans at once.
  Three patterns compose to survive it: a queue absorbs the surge, partitions
  keep each belt in order while belts route in parallel, and a second queue
  feeds the passenger app so that routing falling behind cannot take it down.
  Watch the backlog climb and the passenger app hold its pace anyway.

objectives:
  - See three patterns solve one problem that none of them solves alone
  - Watch a surge become a backlog instead of back-pressure that spreads
  - Confirm each belt stays in scan order while belts are routed in parallel
  - Understand why the passenger app has its own queue rather than sharing one

# Consumers first, and with a pause before the surge: the broker needs a few
# seconds to assign partitions between the two routing instances. The scanner
# is last because it is the event the rest of the scenario responds to.
run:
  - apply
  - build
  - passenger
  - routing-1
  - routing-2
  - scanner

diagram:
  caption: >
    Scans go to a partitioned queue on the broker, where the surge waits to be
    routed. Each routing instance owns a subset of belts and publishes bag
    statuses back to the broker. They land on a queue of their own, so the
    passenger app is paced by its own consumption rather than by how far
    behind routing is.
  duration: 2.8
  liveWhen: scanner
  nodes:
    - id: scanner
      label: Bag Scanners
      sublabel: 500 bags at once
      kind: app
      col: 0
      action: scanner
      requires:
        - label: svc-arrival-scanner
          semp: /msgVpns/{vpn}/clientUsernames/svc-arrival-scanner
    - id: broker
      label: Solace Broker
      sublabel: scans in, statuses out
      kind: broker
      col: 1
      action: apply
      contains:
        - id: scans
          label: q.arrival.scans
        - id: status
          label: q.arrival.status
      provides:
        - label: q.arrival.scans
          group: scans
          semp: /msgVpns/{vpn}/queues/q.arrival.scans
        - label: q.arrival.status
          group: status
          semp: /msgVpns/{vpn}/queues/q.arrival.status
    # Routing consumes scans from the broker and publishes bag statuses back
    # to it, where the passenger app's own queue picks them up.
    - id: routing1
      label: Baggage Routing 1
      sublabel: its share of belts
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: routing-1
      requires:
        - label: svc-arrival-routing
          semp: /msgVpns/{vpn}/clientUsernames/svc-arrival-routing
    - id: routing2
      label: Baggage Routing 2
      sublabel: the other belts
      kind: app
      # Drawn as a hexagon: in at the top point, out at the bottom one.
      shape: processor
      col: 2
      action: routing-2
    - id: passenger
      label: Passenger App
      sublabel: q.arrival.status
      kind: app
      col: 2
      action: passenger
      requires:
        - label: q.arrival.status
          semp: /msgVpns/{vpn}/queues/q.arrival.status
  flows:
    - from: scanner
      to: broker
      label: surge
      delay: 0
    - from: scanner
      to: broker
      delay: 0.15
    - from: scanner
      to: broker
      delay: 0.3
    - from: broker
      to: routing1
      delay: 0.9
    - from: broker
      to: routing2
      delay: 1.1
    - from: routing1
      to: broker
      label: bag status
      delay: 1.6
    - from: routing2
      to: broker
      delay: 1.8
    - from: broker
      to: passenger
      delay: 2.3

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the partitioned scan queue and the separate status queue, plus
      the client profile, ACL profile and three client usernames.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: passenger
    label: Start the passenger app
    kind: process
    cmd: [bash, ../../apps/run.sh, arrival, passenger]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Serves bag status from its own queue at a steady 50ms per lookup. This
      is the pane to watch during the surge: its rate should not move.

  - id: routing-1
    label: Start baggage routing 1
    kind: process
    cmd: [bash, ../../apps/run.sh, arrival, routing, --role, routing-1]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Routes bags at roughly 120ms each, far slower than they arrive. Which
      belts it owns is assigned by the broker when partitions are balanced.

  - id: routing-2
    label: Start baggage routing 2
    kind: process
    cmd: [bash, ../../apps/run.sh, arrival, routing, --role, routing-2]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The second routing instance. Compare the belts named in the two panes
      when they stop: no belt appears in both, and the split is uneven
      because keys are hashed onto partitions rather than dealt out.

  - id: scanner
    label: Land a bank of flights
    kind: process
    cmd: [bash, ../../apps/run.sh, arrival, scanner, --burst, "500", --every, 90s]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Scans 500 bags as fast as it can, then waits ninety seconds and does it
      again. Give the routing instances a few seconds to be assigned
      partitions before starting this.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, capstone-arrival]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes both queues and the access control for this scenario. Any bags
      still waiting to be routed go with them.

# Ways to break the scenario on purpose. Each names the steps that cause it
# and the steps that put things back; see pub-sub for the full shape.
failure_modes:
  - id: routing-fails
    title: A routing instance fails
    breaks: >
      Baggage routing 1 stops. Routing 2 is left to handle every belt.
    watch: >
      Open Routing instances under On the broker: about five seconds after
      routing 1 leaves, routing 2 is the only consumer bound to
      q.arrival.scans and it owns every partition. Its log keeps reporting
      every belt in scan order. Reset starts routing 1, and the partitions are
      shared again.
    why: >
      q.arrival.scans is a partitioned queue: each belt hashes to one
      partition, and each partition is bound to one consumer at a time. When a
      consumer leaves, the broker waits the rebalance delay, then reassigns
      its partitions to the consumers still bound, so no belt is left without
      a router and no belt is processed by two at once.
    real_world: >
      One instance of a keyed, ordered consumer dies during the evening rush.
      With a partitioned queue the remaining instances take over its keys
      within seconds, and ordering per key survives. Without partitions you
      pick between one consumer for ordering and many for throughput. The
      rebalance delay is the window where that work waits, so it is worth
      tuning.
    docs:
      - label: "Go API: publishing with a partition key"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Publish.htm
      - label: "Broker: partition rebalancing"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partition-Rebalancing.htm
    node: routing1
    logs: routing-2
    trigger:
      - stop: routing-1
    reset:
      - start: routing-1

  - id: passenger-offline
    title: The passenger app goes offline
    breaks: >
      The passenger app stops while bags keep being routed.
    watch: >
      Routing is unaffected: it publishes bag statuses whether anyone is
      reading or not. Open Queues under On the broker and watch
      q.arrival.status grow. Reset starts the passenger app, which works
      through every status it missed.
    why: >
      Bag statuses go to a topic that q.arrival.status subscribes to, so they
      are spooled while the passenger app is down. The app is paced by its
      own consumption, not by routing, which is why routing keeps its speed.
    real_world: >
      A customer-facing app or notification service goes down during the
      busiest hour. Because it has its own queue, the operational side does
      not slow down, and passengers get their updates late rather than never.
      The same queue lets you size the app for average load rather than for
      the peak.
    docs:
      - label: "Go API: consuming persistent messages and acknowledgments"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: queues"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Queues.htm
    node: passenger
    logs: passenger
    trigger:
      - stop: passenger
    reset:
      - start: passenger

inspect:
  - label: Queues
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=100
    # During a surge msgSpoolUsage on q.arrival.scans climbs into the tens of
    # thousands of bytes while q.arrival.status stays near zero: the backlog
    # is held where it does no harm, not in front of the passenger app.
    columns: [queueName, accessType, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
  - label: Routing instances
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues/q.arrival.scans/txFlows?count=10
    columns: [clientName, ackedMsgCount, unackedMsgCount, redeliveredMsgCount]
    ui_hint: Manager → Queues → q.arrival.scans → Consumers
  - label: Passenger app
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues/q.arrival.status/txFlows?count=10
    columns: [clientName, ackedMsgCount, unackedMsgCount, redeliveredMsgCount]
    ui_hint: Manager → Queues → q.arrival.status → Consumers
