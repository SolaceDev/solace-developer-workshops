<svg width="2304" height="1300" viewBox="0 0 2304 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ABFF88"/>
      <stop offset="100%" stop-color="#00C895"/>
    </linearGradient>
  </defs>

  <rect width="2304" height="1300" fill="#062038"/>
  <rect y="0" width="2304" height="10" fill="url(#greenGrad)"/>
  <rect y="1290" width="2304" height="10" fill="url(#greenGrad)"/>

  <!-- Title + subtitle -->
  <text x="120" y="162"
        font-family="'Figtree', 'Segoe UI', sans-serif"
        font-size="90" font-weight="700" fill="#FFFFFF">Enterprise Agent Runtime</text>
  <text x="120" y="232"
        font-family="'Figtree', 'Segoe UI', sans-serif"
        font-size="34" fill="#C2F7FF" opacity="0.65">Go-based infrastructure layer that powers every ADLC stage</text>

  <line x1="120" y1="268" x2="2184" y2="268" stroke="#0D3A5C" stroke-width="1.5"/>

  <!-- Capabilities
       Left column:  dot cx=142, text x=180
       Right column: dot cx=1272, text x=1310
       Row 1 (Cap 1 + Cap 3): name y=375  desc y=432
       Row 2 (Cap 2 + Cap 4): name y=570  desc y=627
  -->

  <!-- Cap 1 — Event-driven runtime (left, row 1) -->
  <circle cx="142" cy="372" r="12" fill="#00C895"/>
  <text x="180" y="375" font-family="'Figtree', sans-serif" font-size="50" font-weight="600" fill="#FFFFFF">Event-driven runtime</text>
  <text x="180" y="432" font-family="'Figtree', sans-serif" font-size="34" fill="#C2F7FF" opacity="0.65">High-throughput, Go-based agent execution</text>

  <!-- Cap 2 — CLI tooling (left, row 2) -->
  <circle cx="142" cy="567" r="12" fill="#00C895"/>
  <text x="180" y="570" font-family="'Figtree', sans-serif" font-size="50" font-weight="600" fill="#FFFFFF">CLI tooling</text>
  <text x="180" y="627" font-family="'Figtree', sans-serif" font-size="34" fill="#C2F7FF" opacity="0.65">sam CLI for build, deploy, and configure</text>

  <!-- Cap 3 — Declarative config (right, row 1) -->
  <circle cx="1272" cy="372" r="12" fill="#00C895"/>
  <text x="1310" y="375" font-family="'Figtree', sans-serif" font-size="50" font-weight="600" fill="#FFFFFF">Declarative config</text>
  <text x="1310" y="432" font-family="'Figtree', sans-serif" font-size="34" fill="#C2F7FF" opacity="0.65">YAML-based agent and skill definitions</text>

  <!-- Cap 4 — Gateway integrations (right, row 2) -->
  <circle cx="1272" cy="567" r="12" fill="#00C895"/>
  <text x="1310" y="570" font-family="'Figtree', sans-serif" font-size="50" font-weight="600" fill="#FFFFFF">Gateway integrations</text>
  <text x="1310" y="627" font-family="'Figtree', sans-serif" font-size="34" fill="#C2F7FF" opacity="0.65">Connect agents to external systems</text>

  <line x1="120" y1="730" x2="2184" y2="730" stroke="#0D3A5C" stroke-width="1.5"/>

  <!-- Technology tags  (h=48, rx=24, font=26) -->
  <rect x="120" y="784" width="88" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="164" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">Go</text>

  <rect x="224" y="784" width="204" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="326" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">Event-driven</text>

  <rect x="444" y="784" width="192" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="540" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">Enterprise</text>

  <rect x="652" y="784" width="208" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="756" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">Declarative</text>

  <rect x="876" y="784" width="116" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="934" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">YAML</text>

  <rect x="1008" y="784" width="164" height="48" rx="24" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.8"/>
  <text x="1090" y="815" font-family="'Space Mono', monospace" font-size="26" fill="#00C895" text-anchor="middle">Gateway</text>

  <!-- Summary -->
  <text x="120" y="938"
        font-family="'Figtree', sans-serif"
        font-size="34" fill="#C2F7FF" opacity="0.6">Provides runtime infrastructure, CLI tooling, declarative configuration,</text>
  <text x="120" y="988"
        font-family="'Figtree', sans-serif"
        font-size="34" fill="#C2F7FF" opacity="0.6">and gateway integrations that each ADLC stage depends on.</text>

</svg>
