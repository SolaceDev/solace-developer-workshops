<svg width="620" height="260" viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ABFF88"/>
      <stop offset="100%" stop-color="#00C895"/>
    </linearGradient>
  </defs>

  <rect width="620" height="260" fill="#062038"/>
  <rect y="0" width="620" height="3" fill="url(#greenGrad)"/>
  <rect y="257" width="620" height="3" fill="url(#greenGrad)"/>

  <!-- Overline -->
  <text x="20" y="25"
        font-family="'Space Mono', 'Cascadia Mono', monospace"
        font-size="9" fill="#00C895" letter-spacing="2">SOLACE AGENT MESH</text>

  <!-- Title + subtitle -->
  <text x="20" y="51"
        font-family="'Figtree', 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" fill="#FFFFFF">Enterprise Agent Runtime</text>
  <text x="20" y="69"
        font-family="'Figtree', 'Segoe UI', sans-serif"
        font-size="11.5" fill="#C2F7FF" opacity="0.65">Go-based infrastructure layer that powers every ADLC stage</text>

  <line x1="20" y1="81" x2="600" y2="81" stroke="#0D3A5C" stroke-width="1"/>

  <!-- Capabilities — left column (cx=35, text x=49) -->
  <circle cx="35" cy="105" r="5" fill="#00C895"/>
  <text x="49" y="102" font-family="'Figtree', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Event-driven runtime</text>
  <text x="49" y="117" font-family="'Figtree', sans-serif" font-size="11" fill="#C2F7FF" opacity="0.65">High-throughput, Go-based agent execution</text>

  <circle cx="35" cy="140" r="5" fill="#00C895"/>
  <text x="49" y="137" font-family="'Figtree', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">CLI tooling</text>
  <text x="49" y="152" font-family="'Figtree', sans-serif" font-size="11" fill="#C2F7FF" opacity="0.65">sam CLI for build, deploy, and configure</text>

  <!-- Capabilities — right column (cx=280, text x=294) -->
  <circle cx="280" cy="105" r="5" fill="#00C895"/>
  <text x="294" y="102" font-family="'Figtree', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Declarative config</text>
  <text x="294" y="117" font-family="'Figtree', sans-serif" font-size="11" fill="#C2F7FF" opacity="0.65">YAML-based agent and skill definitions</text>

  <circle cx="280" cy="140" r="5" fill="#00C895"/>
  <text x="294" y="137" font-family="'Figtree', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Gateway integrations</text>
  <text x="294" y="152" font-family="'Figtree', sans-serif" font-size="11" fill="#C2F7FF" opacity="0.65">Connect agents to external systems</text>

  <line x1="20" y1="167" x2="600" y2="167" stroke="#0D3A5C" stroke-width="1"/>

  <!-- Technology tags -->
  <rect x="20" y="176" width="40" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="40" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">Go</text>

  <rect x="70" y="176" width="92" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="116" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">Event-driven</text>

  <rect x="172" y="176" width="80" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="212" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">Enterprise</text>

  <rect x="262" y="176" width="84" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="304" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">Declarative</text>

  <rect x="356" y="176" width="50" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="381" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">YAML</text>

  <rect x="416" y="176" width="68" height="19" rx="9" fill="#00C895" fill-opacity="0.1" stroke="#00C895" stroke-width="0.6"/>
  <text x="450" y="188" font-family="'Space Mono', monospace" font-size="8.5" fill="#00C895" text-anchor="middle">Gateway</text>

  <!-- Summary -->
  <text x="20" y="217"
        font-family="'Figtree', sans-serif"
        font-size="11.5" fill="#C2F7FF" opacity="0.6">Provides runtime infrastructure, CLI tooling, declarative configuration,</text>
  <text x="20" y="233"
        font-family="'Figtree', sans-serif"
        font-size="11.5" fill="#C2F7FF" opacity="0.6">and gateway integrations that each ADLC stage depends on.</text>

</svg>
