<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="Figtree, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#093B5F"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00C895"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FCA829"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="920" height="640" fill="#F4F4F4" rx="14"/>

  <!-- ═══════════════════════════════ TITLE ═══════════════════════════════ -->
  <text x="460" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#093B5F">Inter-Agent Communication</text>
  <text x="460" y="64" text-anchor="middle" font-size="12" fill="#093B5F" opacity="0.6" letter-spacing="1">DISCOVERY  ·  DELEGATION  ·  SYNTHESIS</text>

  <!-- ═══════════════════════════════ ORCHESTRATOR ═══════════════════════ -->
  <rect x="310" y="86" width="300" height="82" rx="10" fill="#FFFFFF" stroke="#093B5F" stroke-width="1.5"/>
  <!-- Green accent bar -->
  <rect x="310" y="86" width="300" height="7" rx="10" fill="#00C895"/>
  <rect x="310" y="90" width="300" height="3" fill="#00C895"/>
  <!-- Label -->
  <text x="460" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#093B5F">Orchestrator Agent</text>
  <text x="460" y="151" text-anchor="middle" font-size="11" fill="#093B5F" opacity="0.7">Reads task · Scans agent cards · Routes sub-tasks</text>

  <!-- ═══════════════════════════════ DISCOVERY BUS ════════════════════════ -->
  <rect x="100" y="228" width="720" height="38" rx="9" fill="#C2F7FF" stroke="#093B5F" stroke-width="1.2"/>
  <text x="460" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#093B5F" letter-spacing="0.5">Shared Discovery Topic</text>

  <!-- Orchestrator subscribes (arrow: orchestrator bottom → bus top) -->
  <line x1="460" y1="168" x2="460" y2="224" stroke="#093B5F" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <rect x="462" y="188" width="74" height="16" rx="4" fill="#F4F4F4" opacity="0.85"/>
  <text x="499" y="200" font-size="9" fill="#093B5F">subscribes</text>

  <!-- ═══════════════════════════════ FOUR AGENTS ══════════════════════════ -->

  <!-- ── WebResearcher ── -->
  <rect x="52" y="322" width="172" height="112" rx="10" fill="#FFFFFF" stroke="#093B5F" stroke-width="1.5"/>
  <rect x="52" y="322" width="172" height="7" rx="10" fill="#00C895"/>
  <rect x="52" y="327" width="172" height="2" fill="#00C895"/>
  <!-- Globe icon -->
  <circle cx="138" cy="358" r="14" fill="none" stroke="#00C895" stroke-width="1.5"/>
  <ellipse cx="138" cy="358" rx="6" ry="14" fill="none" stroke="#00C895" stroke-width="1"/>
  <line x1="124" y1="358" x2="152" y2="358" stroke="#00C895" stroke-width="1"/>
  <line x1="124" y1="352" x2="152" y2="352" stroke="#00C895" stroke-width="0.7"/>
  <line x1="124" y1="364" x2="152" y2="364" stroke="#00C895" stroke-width="0.7"/>
  <text x="138" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#093B5F">WebResearcher</text>
  <text x="138" y="401" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.7">Search · Fetch · Cite</text>
  <!-- Agent card badge -->
  <rect x="68" y="410" width="140" height="17" rx="4" fill="#C7FFCB" stroke="#093B5F" stroke-width="0.5"/>
  <text x="138" y="422" text-anchor="middle" font-size="9" fill="#093B5F" font-weight="600">Agent Card: Web Research</text>

  <!-- ── DataAnalyst ── -->
  <rect x="258" y="322" width="172" height="112" rx="10" fill="#FFFFFF" stroke="#093B5F" stroke-width="1.5"/>
  <rect x="258" y="322" width="172" height="7" rx="10" fill="#00C895"/>
  <rect x="258" y="327" width="172" height="2" fill="#00C895"/>
  <!-- Bar chart icon -->
  <line x1="322" y1="371" x2="360" y2="371" stroke="#093B5F" stroke-width="0.8"/>
  <rect x="325" y="355" width="7" height="16" rx="1" fill="#00C895"/>
  <rect x="336" y="349" width="7" height="22" rx="1" fill="#00C895"/>
  <rect x="347" y="358" width="7" height="13" rx="1" fill="#00C895"/>
  <text x="344" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#093B5F">DataAnalyst</text>
  <text x="344" y="401" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.7">SQL · Stats · Charts</text>
  <rect x="274" y="410" width="140" height="17" rx="4" fill="#C7FFCB" stroke="#093B5F" stroke-width="0.5"/>
  <text x="344" y="422" text-anchor="middle" font-size="9" fill="#093B5F" font-weight="600">Agent Card: Data Analysis</text>

  <!-- ── ImageAnalyst ── -->
  <rect x="464" y="322" width="172" height="112" rx="10" fill="#FFFFFF" stroke="#093B5F" stroke-width="1.5"/>
  <rect x="464" y="322" width="172" height="7" rx="10" fill="#00C895"/>
  <rect x="464" y="327" width="172" height="2" fill="#00C895"/>
  <!-- Image icon -->
  <rect x="523" y="341" width="30" height="24" rx="3" fill="none" stroke="#00C895" stroke-width="1.5"/>
  <circle cx="529" cy="347" r="3" fill="#00C895"/>
  <polyline points="523,360 530,352 537,358 543,351 553,365" fill="none" stroke="#00C895" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="550" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#093B5F">ImageAnalyst</text>
  <text x="550" y="401" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.7">Describe · Generate · Audio</text>
  <rect x="480" y="410" width="140" height="17" rx="4" fill="#C7FFCB" stroke="#093B5F" stroke-width="0.5"/>
  <text x="550" y="422" text-anchor="middle" font-size="9" fill="#093B5F" font-weight="600">Agent Card: Visual Intel</text>

  <!-- ── DiagramGenerator ── -->
  <rect x="670" y="322" width="172" height="112" rx="10" fill="#FFFFFF" stroke="#093B5F" stroke-width="1.5"/>
  <rect x="670" y="322" width="172" height="7" rx="10" fill="#00C895"/>
  <rect x="670" y="327" width="172" height="2" fill="#00C895"/>
  <!-- Node-edge icon -->
  <circle cx="730" cy="350" r="6" fill="none" stroke="#00C895" stroke-width="1.5"/>
  <circle cx="756" cy="365" r="6" fill="none" stroke="#00C895" stroke-width="1.5"/>
  <circle cx="756" cy="337" r="6" fill="none" stroke="#00C895" stroke-width="1.5"/>
  <line x1="736" y1="353" x2="750" y2="362" stroke="#00C895" stroke-width="1.2"/>
  <line x1="736" y1="347" x2="750" y2="340" stroke="#00C895" stroke-width="1.2"/>
  <text x="756" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#093B5F">DiagramGenerator</text>
  <text x="756" y="401" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.7">Mermaid · Doc Convert</text>
  <rect x="686" y="410" width="140" height="17" rx="4" fill="#C7FFCB" stroke="#093B5F" stroke-width="0.5"/>
  <text x="756" y="422" text-anchor="middle" font-size="9" fill="#093B5F" font-weight="600">Agent Card: Diagramming</text>

  <!-- ═══════════════ AGENT CARD PUBLISH arrows (green, solid) ═══════════════ -->
  <!-- Each agent publishes its card UP to the bus -->
  <line x1="138" y1="322" x2="185" y2="266" stroke="#00C895" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="344" y1="322" x2="370" y2="266" stroke="#00C895" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="550" y1="322" x2="524" y2="266" stroke="#00C895" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="756" y1="322" x2="710" y2="266" stroke="#00C895" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- Publish label on leftmost arrow -->
  <rect x="56" y="288" width="72" height="14" rx="3" fill="#F4F4F4" opacity="0.9"/>
  <text x="92" y="299" text-anchor="middle" font-size="9" fill="#009193" font-weight="600">publishes card</text>

  <!-- ═══════════════ DELEGATION arrows (blue dashed, orchestrator → agents) ═══════════════ -->
  <!-- Going from orchestrator bottom edge outward to each agent -->
  <line x1="350" y1="168" x2="138" y2="322" stroke="#093B5F" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr-blue)" opacity="0.6"/>
  <line x1="410" y1="168" x2="320" y2="322" stroke="#093B5F" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr-blue)" opacity="0.6"/>
  <line x1="510" y1="168" x2="564" y2="322" stroke="#093B5F" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr-blue)" opacity="0.6"/>
  <line x1="570" y1="168" x2="770" y2="322" stroke="#093B5F" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr-blue)" opacity="0.6"/>
  <!-- Delegation label midpoint -->
  <rect x="362" y="222" width="120" height="14" rx="3" fill="#F4F4F4" opacity="0.9"/>
  <text x="422" y="233" text-anchor="middle" font-size="9" fill="#093B5F" font-style="italic">delegates sub-tasks</text>

  <!-- ═══════════════ RESULT arrows (orange dashed, agents → orchestrator) ═══════════════ -->
  <line x1="162" y1="322" x2="380" y2="170" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="368" y1="322" x2="430" y2="170" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="532" y1="322" x2="488" y2="170" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="738" y1="322" x2="538" y2="170" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <!-- Result label -->
  <rect x="670" y="218" width="108" height="14" rx="3" fill="#F4F4F4" opacity="0.9"/>
  <text x="724" y="229" text-anchor="middle" font-size="9" fill="#FCA829" font-weight="600">results + artifacts</text>

  <!-- ═══════════════ SYNTHESIS BOX ═══════════════ -->
  <rect x="310" y="510" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#00C895" stroke-width="2"/>
  <text x="460" y="537" text-anchor="middle" font-size="14" font-weight="700" fill="#093B5F">Orchestrator Synthesizes</text>
  <text x="460" y="555" text-anchor="middle" font-size="11" fill="#093B5F" opacity="0.7">Collects all results · Composes final response</text>

  <!-- Arrow from orchestrator down through to synthesis -->
  <line x1="460" y1="168" x2="460" y2="506" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)" opacity="0.35"/>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <rect x="52" y="510" width="224" height="106" rx="9" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/>
  <text x="164" y="530" text-anchor="middle" font-size="11" font-weight="700" fill="#093B5F">Legend</text>
  <!-- green solid -->
  <line x1="70" y1="546" x2="104" y2="546" stroke="#00C895" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="112" y="550" font-size="10" fill="#093B5F">Agent card published to bus</text>
  <!-- blue dashed -->
  <line x1="70" y1="565" x2="104" y2="565" stroke="#093B5F" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="112" y="569" font-size="10" fill="#093B5F">Task delegated to agent</text>
  <!-- orange dashed -->
  <line x1="70" y1="584" x2="104" y2="584" stroke="#FCA829" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <text x="112" y="588" font-size="10" fill="#093B5F">Results returned</text>
  <!-- badge sample -->
  <rect x="70" y="596" width="18" height="12" rx="3" fill="#C7FFCB" stroke="#093B5F" stroke-width="0.5"/>
  <text x="96" y="607" font-size="10" fill="#093B5F">Agent card badge</text>

  <!-- ═══════════════ NOTE BOX ═══════════════ -->
  <rect x="644" y="510" width="224" height="106" rx="9" fill="#FFF7C2" stroke="#093B5F" stroke-width="1"/>
  <text x="756" y="530" text-anchor="middle" font-size="11" font-weight="700" fill="#093B5F">Discovery Off</text>
  <text x="756" y="548" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.85">Leaf agents can disable</text>
  <text x="756" y="564" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.85">discovery to stay focused on</text>
  <text x="756" y="580" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.85">their own role — avoiding</text>
  <text x="756" y="596" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.85">accumulation of unused</text>
  <text x="756" y="612" text-anchor="middle" font-size="10" fill="#093B5F" opacity="0.85">peer tools.</text>
</svg>
