kind: manifest
name: 12-workflows
description: Adds the travel planning workflow and routes the orchestrator to it
target:
  url: http://localhost:8800
resources:
  toolsets:
    - travel-planner
  connectors:
    - flights-db
    - hotels-db
    - places-mcp
  agents:
    - HotelSearchAgent
    - LocalExperiencesAgent
    - TravelOrchestratorAgent
  workflows:
    - TravelPlanningWorkflow
