<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#03213B"/>
  <!-- Flowing S-wave: two connected arcs in Classic Green -->
  <!-- Top arc: curves right -->
  <path d="M10,10 Q22,10 22,16" fill="none" stroke="#00C895" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom arc: curves left (mirror) -->
  <path d="M22,16 Q10,16 10,22" fill="none" stroke="#00C895" stroke-width="3" stroke-linecap="round"/>
  <!-- Dot at start and end for the mesh feel -->
  <circle cx="10" cy="10" r="2" fill="#00C895"/>
  <circle cx="22" cy="16" r="2" fill="#ABFF88"/>
  <circle cx="10" cy="22" r="2" fill="#00C895"/>
</svg>
